[Proxy]
HK = Shadowsocks, hk.example.com, 443, aes-128-gcm, "pw,quoted", fast-open=true, udp=true
ANY = anytls, any.example.com, 443, "native-pw", tls-name=edge.example.com, udp=true
EXIT = socks5, exit.example.com, 1080, user, "pass"

[Proxy Chain]
CHAIN = HK, EXIT, udp=true

[Proxy Group]
OUT = select, HK_GROUP, CHAIN_GROUP, DIRECT
HK_GROUP = url-test, HK, ANY, url=http://www.gstatic.com/generate_204, interval=300, tolerance=100
CHAIN_GROUP = select, CHAIN

[Rule]
GEOIP,CN,DIRECT
FINAL,OUT

[Remote Rule]
https://example.com/a.list,OUT
https://example.com/b.list,OUT
